name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install checks
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Parse scripts
        run: bash -n install.sh tests/run.sh
      - name: Run tests
        run: bash tests/run.sh
      - name: ShellCheck
        run: shellcheck install.sh tests/run.sh
